  const { useState } = React;
                
        const App = () => {
            // 基本情報（デフォルト値設定）
            const [eventName, setEventName] = useState('組合イベント');
            const [eventDate, setEventDate] = useState('');
            const [organizer, setOrganizer] = useState('横浜建設一般労働組合　保土ヶ谷西支部　担当：松崎　昇');
            
            // 収入（参加費）
            const [incomes, setIncomes] = useState([]);
            const [newIncome, setNewIncome] = useState({ name: '', amount: '' });
            const [editingIncomeId, setEditingIncomeId] = useState(null);
            const [commonAmount, setCommonAmount] = useState(''); // 全員同一金額
            
            // 支出（立替払い）
            const [expenses, setExpenses] = useState([]);
            const [newExpense, setNewExpense] = useState({ payee: '', item: '店舗への支払い', amount: '' });
            const [editingExpenseId, setEditingExpenseId] = useState(null);
            
            // 印刷モード管理
            const [printMode, setPrintMode] = useState(null); // 'report', 'single', 'batch'
            const [printTargetIncome, setPrintTargetIncome] = useState(null);
            
            // 保存されたイベント一覧
            const [savedEvents, setSavedEvents] = useState([]);
            
            // 収入追加/編集
            const handleAddIncome = () => {
                if (!newIncome.name) {
                    alert('参加者名を入力してください');
                    return;
                }
                
                // 金額が空の場合は0として扱う
                const amount = newIncome.amount ? parseInt(newIncome.amount) : 0;
                
                if (editingIncomeId) {
                    setIncomes(incomes.map(inc => 
                        inc.id === editingIncomeId 
                            ? { ...inc, name: newIncome.name, amount: amount }
                            : inc
                    ));
                    setEditingIncomeId(null);
                } else {
                    const income = {
                        id: Date.now(),
                        name: newIncome.name,
                        amount: amount,
                        receiptIssued: false
                    };
                    setIncomes([...incomes, income]);
                }
                setNewIncome({ name: '', amount: '' });
            };
            
            // 収入編集開始
            const startEditIncome = (income) => {
                setNewIncome({ name: income.name, amount: income.amount.toString() });
                setEditingIncomeId(income.id);
            };
            
            // 収入削除
            const deleteIncome = (id) => {
                if (confirm('削除してよろしいですか？')) {
                    setIncomes(incomes.filter(inc => inc.id !== id));
                }
            };
            
            // 支出追加/編集
            const handleAddExpense = () => {
                if (!newExpense.payee || !newExpense.item || !newExpense.amount) {
                    alert('すべての項目を入力してください');
                    return;
                }
                
                if (editingExpenseId) {
                    setExpenses(expenses.map(exp => 
                        exp.id === editingExpenseId 
                            ? { ...exp, payee: newExpense.payee, item: newExpense.item, amount: parseInt(newExpense.amount) }
                            : exp
                    ));
                    setEditingExpenseId(null);
                } else {
                    const expense = {
                        id: Date.now(),
                        payee: newExpense.payee,
                        item: newExpense.item,
                        amount: parseInt(newExpense.amount)
                    };
                    setExpenses([...expenses, expense]);
                }
                setNewExpense({ payee: '', item: '店舗への支払い', amount: '' });
            };
            
            // 支出編集開始
            const startEditExpense = (expense) => {
                setNewExpense({ payee: expense.payee, item: expense.item, amount: expense.amount.toString() });
                setEditingExpenseId(expense.id);

                const saved = localStorage.getItem('savedEvents');

                // 同名・同日のイベントがあれば上書き確認
                const existingIndex = events.findIndex(e => 
                    e.eventName === eventName && e.eventDate === eventDate
                );
                
                if (existingIndex >= 0) {
                    if (!confirm('同じイベントが既に保存されています。上書きしますか？')) {
                        return;
                    }
                    events[existingIndex] = eventData;
                } else {
                    events.push(eventData);
                }
                
                localStorage.setItem('savedEvents', JSON.stringify(events));
                setSavedEvents(events);
                alert('イベントを保存しました');
            };
            
            // イベント読み込み
            const loadEvent = (eventData) => {
                if (!confirm(`「${eventData.eventName}」を読み込みますか？現在のデータは失われます。`)) {
                    return;
                }
                
                setEventName(eventData.eventName);
                setEventDate(eventData.eventDate);
                setOrganizer(eventData.organizer);
                setIncomes(eventData.incomes || []);
                setExpenses(eventData.expenses || []);

                            <h2 style={{ fontSize: '18px', fontWeight: 'bold', marginBottom: '8px' }}>収入明細</h2>
                            <div style={{ border: '1px solid #000', padding: '8px', marginBottom: '16px', fontSize: '14px' }}>
                                {incomes.map((income, index) => (
                                    <span key={income.id}>
                                        {income.name}(¥{income.amount.toLocaleString()})
                                        {index < incomes.length - 1 ? '、' : ''}
                                    </span>
                                ))}
                                <div style={{ marginTop: '8px', fontWeight: 'bold', paddingTop: '8px', borderTop: '1px solid #000' }}>
                                    合計: ¥{totalIncome.toLocaleString()}
                                </div>
                            </div>
                            
                            <h2 style={{ fontSize: '18px', fontWeight: 'bold', marginBottom: '8px' }}>支出明細</h2>
                            <table style={{ width: '100%', marginBottom: '16px', fontSize: '14px', borderCollapse: 'collapse' }}>
                                <thead>
                                    <tr>
                                        <th style={{ border: '1px solid #000', padding: '8px', textAlign: 'left' }}>支払先</th>
                                        <th style={{ border: '1px solid #000', padding: '8px', textAlign: 'left' }}>品目</th>
                                        <th style={{ border: '1px solid #000', padding: '8px', textAlign: 'right' }}>金額</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {expenses.map(expense => (
                                        <tr key={expense.id}>
                                            <td style={{ border: '1px solid #000', padding: '8px' }}>{expense.payee}</td>
                                            <td style={{ border: '1px solid #000', padding: '8px' }}>{expense.item}</td>
                                            <td style={{ border: '1px solid #000', padding: '8px', textAlign: 'right' }}>¥{expense.amount.toLocaleString()}</td>
                                        </tr>
                                    ))}
                                    <tr style={{ fontWeight: 'bold' }}>
                                        <td style={{ border: '1px solid #000', padding: '8px' }} colSpan="2">合計</td>
                                        <td style={{ border: '1px solid #000', padding: '8px', textAlign: 'right' }}>¥{totalExpense.toLocaleString()}</td>
                                    </tr>
                                </tbody>
                            </table>
                            
                            <div style={{ background: '#f3f4f6', padding: '12px', marginBottom: '16px' }}>
                                <p style={{ fontSize: '18px', fontWeight: 'bold' }}>
                                    {balance >= 0 ? '請求額' : '返納額'}: ¥{Math.abs(balance).toLocaleString()}
                                </p>
                            </div>
                        </div>
                        
                        <div style={{ height: '45vh', borderTop: '2px dashed #999', paddingTop: '20px' }}>
                            <h2 style={{ textAlign: 'center', fontSize: '18px', fontWeight: 'bold', marginBottom: '16px' }}>領収書貼付欄</h2>
                            <div style={{ border: '2px solid #333', height: '90%', padding: '10px' }}>
                                <p style={{ fontSize: '14px', color: '#666' }}>※ 立替払いの領収書をこちらに貼付してください</p>
                            </div>
                        </div>
                    </div>
                    
                    {/* 個別領収書印刷エリア（A4縦・1人） */}
                    <div className="print-area" id="print-single" data-print-active={printMode === 'single' ? 'true' : 'false'}>
                        {printTargetIncome && (
                            <div style={{ padding: '8mm 8mm' }}>
                                <ReceiptHorizontal income={printTargetIncome} />
                            </div>
                        )}
                    </div>
                    
                    {/* 一抬領収書印刷エリア（A4縦・4人/枚） */}
                    <div className="print-area" id="print-batch" data-print-active={printMode === 'batch' ? 'true' : 'false'}>
                        {receiptPages.map((pageIncomes, pageIndex) => (
                            <div key={pageIndex} className="receipt-batch-page" style={{ padding: '8mm 8mm' }}>
                                {pageIncomes.map((income) => (
                                    <ReceiptHorizontal key={income.id} income={income} />
                                ))}
                            </div>
                        ))}
                    </div>
                </>
            );
        };
        
        // Reactアプリケーションをレンダリング
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
